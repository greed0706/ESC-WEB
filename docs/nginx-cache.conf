# =====================================================================
# Cache trình duyệt cho ecs.edu.vn — cấu hình NGINX (việc #10)
#
# VÌ SAO CẦN FILE NÀY: production chạy nginx (đo được: `Server: nginx/1.31.1`),
# mà nginx KHÔNG đọc .htaccess. File .htaccess ở web root chỉ có tác dụng trên
# máy dev Laragon (Apache). Muốn cache chạy trên production thì phải dán đoạn
# dưới vào server block của nginx rồi reload — theme không tự làm được.
#
# HIỆN TRẠNG ĐO NGÀY 2026-08-21:
#   - gzip: ĐÃ BẬT (main.css 99.599 B -> 14.931 B, giảm 85%). Không cần đụng.
#   - Cache-Control: KHÔNG CÓ header nào cho css/js/ảnh -> mỗi lần tải trang
#     trình duyệt lại hỏi server toàn bộ tài nguyên. Đây là thứ đoạn này chữa.
#
# CÁCH ÁP DỤNG
#   1. Mở file cấu hình site, thường là /etc/nginx/sites-available/ecs.edu.vn
#      (hoặc /etc/nginx/conf.d/ecs.edu.vn.conf)
#   2. Dán các khối `location` dưới vào TRONG `server { ... }` của bản HTTPS,
#      đặt TRƯỚC khối `location / { try_files ... }`
#   3. Kiểm tra cú pháp — bước này BẮT BUỘC, sai cú pháp mà reload là site chết:
#         sudo nginx -t
#   4. Nạp lại (reload KHÔNG làm rớt kết nối đang chạy, khác với restart):
#         sudo systemctl reload nginx
#
# KIỂM CHỨNG SAU KHI ÁP DỤNG
#   curl -sI https://ecs.edu.vn/wp-content/themes/ecsges/assets/css/main.css | grep -i cache-control
#   -> phải thấy: Cache-Control: public, max-age=2592000
# =====================================================================

# ---- Ảnh, icon và font: 1 năm + immutable ----------------------------
# "immutable" = trình duyệt không hỏi lại server kể cả khi người dùng bấm F5.
# Chỉ an toàn với file mà đổi nội dung thì đổi luôn tên: ảnh trong Thư viện
# WordPress (tên có kèm kích thước) và font tự host đều đúng như vậy.
#
# Lỡ cần thay một file mà GIỮ NGUYÊN tên: đổi tên file rồi cập nhật chỗ tham
# chiếu, đừng ghi đè — người đã vào site sẽ giữ bản cũ tới 1 năm.
location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff2|woff|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# ---- CSS/JS: 30 ngày, KHÔNG immutable -------------------------------
# Theme gắn ?ver=filemtime vào URL (xem ecsges_assets trong functions.php) nên
# sửa file là URL đổi, trình duyệt tải lại ngay. Nhưng asset của core/plugin thì
# không chắc có cache-busting tin cậy — để immutable thì lỡ có bản vá bảo mật,
# trình duyệt vẫn dùng file cũ cho tới khi hết hạn.
location ~* \.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    try_files $uri =404;
}

# ---- Trang HTML: KHÔNG cache ----------------------------------------
# Chỉ thêm nếu chưa có plugin page cache. Trang phải luôn mới, nếu không sửa
# nội dung xong người dùng vẫn thấy bản cũ.
#
# `always` là bắt buộc: thiếu nó thì add_header bị bỏ qua với các mã phản hồi
# khác 200 (301, 404...) — đúng những trang hay bị cache nhầm nhất.
location = / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.php?$args;
}

# =====================================================================
# GHI CHÚ KHI VỀ SAU CÀI PLUGIN PAGE CACHE
#
# WP Super Cache / LiteSpeed Cache sinh file HTML tĩnh và cần nginx trỏ vào
# đó trước khi gọi PHP. Lúc ấy khối `location = /` ở trên phải sửa lại theo
# hướng dẫn của plugin, nếu không nginx vẫn đẩy mọi request qua PHP và cache
# không có tác dụng.
#
# TRƯỚC KHI BẬT PAGE CACHE, phải sửa wp-config.php: hiện WP_HOME/WP_SITEURL
# đang dựng động từ $_SERVER['HTTP_HOST'] (dòng 41–42). Header Host do trình
# duyệt gửi lên nên mỗi giá trị Host khác nhau sẽ sinh một bản HTML khác nhau
# và cache lưu lẫn lộn. Thay bằng giá trị cố định:
#     define( 'WP_SITEURL', 'https://ecs.edu.vn' );
#     define( 'WP_HOME',    'https://ecs.edu.vn' );
# =====================================================================
